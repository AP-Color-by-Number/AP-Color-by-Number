<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color by Number AP</title>
  <meta name="description" content="A color-by-number game for Archipelago: every numbered color is an item.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:image" content="https://lighting8282.github.io/AP-Color-by-Number/assets/icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1><a id="home" href="./" title="Back to the front page"><img class="logo" src="assets/icon-512.png" alt="" width="28" height="28">Color by Number <small>AP</small></a></h1>
    <span id="status" class="status">Not connected</span>
  </header>

  <section id="connect" class="panel">
    <form id="connect-form">
      <h2>Connect</h2>
      <label>Server <input id="server" autocomplete="off" placeholder="archipelago.gg:38281" required></label>
      <label>Slot name <input id="slot" autocomplete="off" required></label>
      <label>Password <input id="password" type="password" autocomplete="off"></label>
      <button type="submit" class="primary">Connect</button>
      <p id="connect-error" class="error" role="alert"></p>
    </form>
    <form id="offline-form">
      <h2>Practice offline</h2>
      <p class="hint">Everything unlocked, nothing sent. Good for trying out uploads.</p>
      <div class="row">
        <label>Pictures <input id="off-pictures" type="number" min="1" max="10" value="2"></label>
        <label>Colors <input id="off-colors" type="number" min="4" max="24" value="10"></label>
        <label>Grid <input id="off-grid" type="number" min="16" max="64" value="32"></label>
      </div>
      <button type="submit">Start practice</button>
    </form>
  </section>

  <main id="game" hidden>
    <nav id="tabs" class="tabs" aria-label="Pictures"></nav>

    <div class="board">
      <div id="effects" class="effects" aria-live="polite"></div>
      <div id="scroller" class="scroller">
        <canvas id="canvas"></canvas>
      </div>
      <div id="locked" class="locked" hidden>
        <p>🔒 <strong id="locked-name"></strong> is still locked.</p>
        <p class="hint">Someone in the multiworld has to send it to you.</p>
      </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Tools">
      <div class="group" id="tools">
        <button data-tool="brush" class="tool" aria-pressed="true" title="Brush: one cell (drag to paint more)">🖌️ Brush</button>
        <button data-tool="bucket" class="tool" aria-pressed="false" title="Paint Bucket: fills a connected patch of the number">💧 Bucket <span class="charges" id="bucket-charges"></span></button>
        <button data-tool="wide" class="tool" aria-pressed="false" title="Wide Brush: matching cells in a 5x5 square">🧹 Wide <span class="charges" id="wide-charges"></span></button>
        <button id="move" class="tool" aria-pressed="false" title="Move: scroll the picture instead of painting">✋ Move</button>
      </div>
      <div class="group">
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-fit" title="Fit to screen">Fit</button>
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
      <div class="group">
        <label class="button" title="Use your own image for this picture">⬆️ Upload image<input id="upload" type="file" accept="image/*" hidden></label>
        <button id="regen" title="Go back to this picture's generated image">Generated</button>
      </div>
    </div>

    <div id="progress" class="progress"></div>
    <div id="palette" class="palette" aria-label="Colors"></div>

    <details id="logbox" class="log" open>
      <summary>Log</summary>
      <ol id="log"></ol>
    </details>
  </main>

  <footer class="credits">Inspired by an idea from Discord user <strong>Dratini64</strong> ·
    <a href="https://github.com/lighting8282/AP-Color-by-Number">GitHub</a></footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
